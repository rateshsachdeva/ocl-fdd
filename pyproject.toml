[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocl-fdd"
version = "0.1.0"
description = "Dynamic, auditable Other Current Liabilities financial due diligence skill"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
